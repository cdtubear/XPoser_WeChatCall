plugins {
    id 'com.android.application'
}

// release 签名信息由环境变量注入，未提供时产出 unsigned 包（供本地调试/CI 的 debug 构建使用）
def releaseKeystoreFile = System.getenv('XP_KEYSTORE_FILE')
def hasReleaseKeystore = releaseKeystoreFile != null && !releaseKeystoreFile.trim().isEmpty() && file(releaseKeystoreFile).exists()

android {
    namespace 'com.cdtubear.xpwechatcall'
    compileSdk 36
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "com.cdtubear.xpwechatcall"
        minSdk 30
        targetSdk 36
        versionCode 261006
        versionName "1.1"
    }

    signingConfigs {
        debug {
            v1SigningEnabled true
            v2SigningEnabled true
        }
        release {
            v1SigningEnabled true
            v2SigningEnabled true

            if (hasReleaseKeystore) {
                storeFile file(releaseKeystoreFile)
                storePassword System.getenv('XP_KEYSTORE_PASSWORD')
                keyAlias System.getenv('XP_KEY_ALIAS')
                keyPassword System.getenv('XP_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // 代码混淆
            minifyEnabled false

            // 移除没用的资源文件
            shrinkResources false

            // 关闭调试选项
            debuggable false

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // 提供 keystore 时才签名，否则仍可产出 unsigned 包
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    packaging {
        resources {
            excludes += "META-INF/**"
            excludes += "DebugProbesKt.bin"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    compileOnly 'de.robv.android.xposed:api:82:sources'
}
