name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
      - 'imgs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'imgs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: Build debug APK
    # tag 推送只走 release job
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: XpWeChatCall-debug-${{ github.sha }}
          path: src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Build signed release APK
    # 只有打 v* tag 或手动触发时才构建 release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    defaults:
      run:
        working-directory: src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=0
          check_secret() {
            if [ -z "${!1}" ]; then
              echo "::error::缺少仓库 Secret：$2"
              missing=1
            fi
          }
          check_secret KEYSTORE_BASE64 RELEASE_KEYSTORE_BASE64
          check_secret STORE_PASSWORD RELEASE_STORE_PASSWORD
          check_secret KEY_ALIAS RELEASE_KEY_ALIAS
          check_secret KEY_PASSWORD RELEASE_KEY_PASSWORD
          if [ "$missing" -ne 0 ]; then
            echo "请在仓库 Settings → Secrets and variables → Actions 中配置上述 Secret（参见 README）。"
            exit 1
          fi

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > "$KEYSTORE_PATH"
          echo "XP_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build signed release APK
        env:
          XP_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          XP_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          XP_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::未找到 release APK"
            exit 1
          fi
          case "$APK" in
            *unsigned*)
              echo "::error::产出的是 unsigned APK，签名配置未生效"
              exit 1
              ;;
          esac
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Prepare artifact
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            VERSION="manual-${GITHUB_RUN_NUMBER}"
          fi
          VERSION="${VERSION//\//-}"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK_PATH" "$GITHUB_WORKSPACE/dist/XpWeChatCall-${VERSION}.apk"
          ls -l "$GITHUB_WORKSPACE/dist"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: XpWeChatCall-release-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: dist/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
